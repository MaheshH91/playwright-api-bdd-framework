name: API BDD Test Suite

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target API environment'
        required: true
        default: 'local'
        type: choice
        options:
          - local
          - qa
          - prod
      tags:
        description: 'Cucumber tag expression (e.g. @smoke, @regression, or leave empty for all)'
        required: false
        default: ''
        type: string
      workers:
        description: 'Number of parallel Cucumber workers'
        required: false
        default: '3'
        type: string

jobs:
  api-tests:
    name: Run API BDD Tests (${{ github.event.inputs.environment || 'local' }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24.21.0
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run typecheck

      - name: Execute API BDD tests
        env:
          API_ENV: ${{ github.event.inputs.environment || 'local' }}
          API_KEY: ${{ secrets.API_KEY }}
          BASE_URL: ${{ vars.BASE_URL }}
          TIMEOUT_MS: ${{ vars.TIMEOUT_MS || '10000' }}
        run: |
          WORKERS="${{ github.event.inputs.workers || '3' }}"
          TAGS="${{ github.event.inputs.tags }}"
          EXTRA_ARGS="--parallel ${WORKERS}"
          if [ -n "$TAGS" ]; then
            EXTRA_ARGS="${EXTRA_ARGS} --tags '${TAGS}'"
          fi

          if [ "$API_ENV" = "local" ]; then
            eval "node scripts/run-local.mjs ${EXTRA_ARGS}"
          else
            eval "node scripts/run.mjs ${EXTRA_ARGS}"
          fi

      - name: Publish JUnit Test Summary
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: 'reports/junit-report.xml'
          check_name: 'Cucumber API Test Results'
          fail_on_failure: false

      - name: Upload HTML & JSON Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-${{ github.run_number }}
          path: reports/
          retention-days: 14

      - name: Send test report email
        uses: dawidd6/action-send-mail@v3
        if: always() && secrets.MAIL_SERVER != ''
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: ${{ secrets.MAIL_FROM }}
          to: ${{ secrets.MAIL_TO }}
          subject: "API BDD Tests (${{ job.status }}): ${{ github.repository }} #${{ github.run_number }}"
          body: |
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Environment: ${{ github.event.inputs.environment || 'local' }}
            Status: ${{ job.status }}
            Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Artifact: reports-${{ github.run_number }}
          attachments: reports/html/index.html,reports/junit-report.xml
